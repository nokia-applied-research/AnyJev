[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anyjev"
version = "0.3.0"
description = "AnyJev: Jev-style typed decisions with probabilities from open LLMs: a training-free readout of any model, and the self-distilled Tacit models. Not affiliated with TypeSafe AI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Jiamu Zhang" },
    { name = "Tianze Yang" },
    { name = "Yucheng Shi" },
    { name = "Liang Wu" },
]
keywords = ["llm", "decision", "calibration", "jev", "system-one", "self-distillation", "vllm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hf = ["torch>=2.3", "transformers>=4.53"]
vllm = ["vllm>=0.17.1"]
# a client of a running `vllm serve` (engine="server", python -m anyjev.serve) needs only the tokenizer
client = ["transformers>=4.53", "jinja2"]   # jinja2: the tokenizer's chat template (apply_chat_template)
# scripts/eval_tacit.py: the bev-decision split and the tokenizer
eval = ["datasets>=2.20", "transformers>=4.53"]
# anyjev.backends.llamacpp: GGUF models through llama-cpp-python
llamacpp = ["llama-cpp-python>=0.3.16"]
# jinja2 so CI exercises the default GGUF chat-template path (llama-cpp-python depends on it too)
dev = ["pytest>=8", "ruff", "jinja2"]

[project.urls]
Homepage = "https://github.com/nokia-applied-research/AnyJev"
Repository = "https://github.com/nokia-applied-research/AnyJev"
Changelog = "https://github.com/nokia-applied-research/AnyJev/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["anyjev*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs an inference engine installed or running (llama.cpp, vLLM, SGLang, ...); skipped when it is not"]

